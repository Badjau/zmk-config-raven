<text x="941" y="698" class="small">R4 C4</text>

<text x="144" y="207" class="label" style="fill:#0284c7;font-weight:bold">P0.31 ? pin 1 row wire (sense input)</text>
<text x="843" y="785" class="label" style="fill:#dc2626;font-weight:bold">P1.13</text>
<text x="843" y="807" class="small">Diode-side column</text>
<text x="843" y="827" class="small">Drive output</text>
<text x="40" y="854" class="label">When pressed: P1.13 ? diode anode ? cathode ? switch pin 2 ? pin 1 ? P0.31.</text>
<text x="40" y="882" class="small">*T is shown at the right edge as a reference; on your actual keyboard it is physical key 6, not key 4.</text>
<text x="40" y="906" class="small">Other GPIOs are deliberately unspecified. Wire crossings connect only where a dot is drawn.</text>
<text x="40" y="929" class="small">Firmware currently calls P1.13 row 0 and P0.31 column 0; those labels differ from the physical wire directions.</text>
