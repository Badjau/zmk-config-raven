<use href="#key" x="835" y="220"/>
<text x="941" y="263" class="small">T reference*</text>
<use href="#key" x="235" y="365"/>
<text x="341" y="408" class="small">R2 C1</text>
<use href="#key" x="435" y="365"/>
<text x="541" y="408" class="small">R2 C2</text>
<use href="#key" x="635" y="365"/>
<text x="741" y="408" class="small">R2 C3</text>
<use href="#key" x="835" y="365"/>
<text x="941" y="408" class="small">R2 C4</text>
<use href="#key" x="235" y="510"/>
